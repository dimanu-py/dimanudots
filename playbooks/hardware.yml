---
# Phase 3: Hardware Support playbook
# Auto-detects and installs GPU drivers, audio, bluetooth, network

- name: Phase 3 - Hardware Support
  hosts: localhost
  become: true
  gather_facts: yes
  
  tasks:
    - name: Import GPU drivers setup
      include_tasks: ../tasks/hardware_gpu.yml
      tags:
        - hardware
        - gpu
        - drivers

    - name: Import audio system setup
      include_tasks: ../tasks/hardware_audio.yml
      tags:
        - hardware
        - audio
        - pipewire

    - name: Import Bluetooth services setup
      include_tasks: ../tasks/hardware_bluetooth.yml
      tags:
        - hardware
        - bluetooth
        - services

    - name: Import network configuration
      include_tasks: ../tasks/hardware_network.yml
      tags:
        - hardware
        - network
        - connectivity

    # Verification tasks
    - name: Verify GPU hardware detection
      command: lspci | grep -i 'VGA\|3D'
      register: gpu_verify
      tags:
        - hardware
        - verification

    - name: Verify audio system
      command: pactl info
      register: audio_verify
      tags:
        - hardware
        - verification

    - name: Verify Bluetooth system
      command: systemctl status bluetooth
      register: bluetooth_verify
      tags:
        - hardware
        - verification

    - name: Verify network connectivity
      command: nmcli device status
      register: network_verify
      tags:
        - hardware
        - verification

    - name: Display hardware support summary
      debug:
        msg: |
          Hardware Support Installation Complete:
          - GPU: {{ gpu_verify.stdout | default('Unknown') }}
          - Audio: {{ 'Pipewire' if 'pipewire' in audio_verify.stdout else 'Unknown' }}
          - Bluetooth: {{ 'active' if bluetooth_verify.stdout == 'active' else 'inactive' }}
          - Network: {{ 'Connected' if 'connected' in network_verify.stdout else 'Unknown' }}
      tags:
        - hardware
        - summary