---
# Global variables for all hosts
# These variables are used across all playbooks and roles

# User configuration
user: "{{ lookup('env', 'USER') }}"
home: "{{ lookup('env', 'HOME') }}"

# Bootstrap phase packages - Essential for system preparation
bootstrap_packages:
  - name: base-devel
    reason: "Build tools for AUR packages (make, gcc, etc.)"
  - name: git
    reason: "Version control for cloning repositories"
  - name: wget
    reason: "File downloader (fallback tool)"
  - name: curl
    reason: "Primary file transfer tool"
  - name: python
    reason: "Ansible runtime dependency"
  - name: ansible
    reason: "Automation tool itself"

# Required Ansible collections for extended functionality
ansible_collections:
  - name: community.general
    version: ">=8.0.0"
    reason: "Provides yay module and system utilities for Arch Linux"
  - name: ansible.posix
    version: ">=1.5.0"
    reason: "Provides filesystem and POSIX system modules"
  - name: community.crypto
    version: ">=2.0.0"
    reason: "Provides cryptographic and SSL modules for security tasks"

# Hardware support packages - GPU, audio, bluetooth, network
hardware_packages:
  # GPU drivers - Auto-detect GPU type
  - name: dkms
    category: gpu
    reason: "Dynamic kernel module support for NVIDIA and other drivers"
  - name: nvidia-dkms
    category: gpu
    reason: "NVIDIA proprietary drivers with dynamic kernel module support"
  - name: nvidia-open-dkms
    category: gpu
    reason: "NVIDIA open-source drivers for better compatibility"
  - name: nvidia-utils
    category: gpu
    reason: "NVIDIA userspace utilities and configuration tools"
  - name: lib32-nvidia-utils
    category: gpu
    reason: "NVIDIA 32-bit compatibility libraries for applications"
  - name: libva-nvidia-driver
    category: gpu
    reason: "NVIDIA VA-API driver for video acceleration"
  - name: amdgpu
    category: gpu
    reason: "AMD GPU support with integrated driver"
  - name: mesa
    category: gpu
    reason: "OpenGL implementation and 3D graphics library"
  - name: lib32-mesa
    category: gpu
    reason: "32-bit Mesa libraries for compatibility"
  - name: vulkan-radeon
    category: gpu
    reason: "Vulkan support for AMD GPUs"
  - name: vulkan-intel
    category: gpu
    reason: "Vulkan support for Intel GPUs"
  - name: intel-media-driver
    category: gpu
    reason: "Intel GPU media acceleration and codecs"
  - name: hwinfo
    category: gpu
    reason: "Hardware information tool for GPU detection"

  # Audio setup - Pipewire backend with additional tools
  - name: pipewire
    category: audio
    reason: "Modern audio server replacing PulseAudio"
  - name: pipewire-pulse
    category: audio
    reason: "PulseAudio compatibility layer for Pipewire"
  - name: pipewire-alsa
    category: audio
    reason: "ALSA support through Pipewire"
  - name: wireplumber
    category: audio
    reason: "Session manager for Pipewire media session"
  - name: helvum
    category: audio
    reason: "Terminal-based audio control interface"
  - name: pamixer
    category: audio
    reason: "Command-line audio mixer with visual interface"
  - name: pavucontrol
    category: audio
    reason: "GUI audio configuration and control panel"
  - name: pipewire-jack
    category: audio
    reason: "JACK audio support through Pipewire"
  - name: wiremix
    category: audio
    reason: "Audio mixing and routing for complex setups"

  # Bluetooth services
  - name: bluez
    category: bluetooth
    reason: "Core Bluetooth protocol stack"
  - name: bluez-utils
    category: bluetooth
    reason: "Bluetooth management utilities and tools"
  - name: bluetui
    category: bluetooth
    reason: "Terminal User Interface for Bluetooth management"

  # Network configuration and tools
  - name: networkmanager
    category: network
    reason: "NetworkManager daemon for network management"
  - name: network-manager-applet
    category: network
    reason: "System tray applet for network connection status"
  - name: nm-connection-editor
    category: network
    reason: "GUI tool for editing NetworkManager connections"
  - name: whois
    category: network
    reason: "Domain and network information lookup tool"
  - name: impala
    category: network
    reason: "Terminal User Interface for WiFi management"

  # GPU driver selection
gpu_driver: "auto"  # auto, nvidia, amd, intel

  # Audio backend selection
audio_backend: "pipewire"  # pipewire, pulseaudio

# Base system packages - Essential system utilities
base_system_packages:
  - name: btop
    category: monitoring
    reason: "Advanced system monitor with resource usage"
  - name: fastfetch
    category: monitoring
    reason: "Fast system information display tool"
  - name: nautilus
    category: filemanagement
    reason: "GUI file manager for desktop environment"
  - name: sushi
    category: filemanagement
    reason: "Quick file preview tool for nautilus"
  - name: ncdu
    category: disk
    reason: "NCurses disk usage analyzer for large directories"
  - name: tree
    category: disk
    reason: "Directory tree visualization tool"

# Base system directories - Essential user directories
base_directories:
  - name: Documents
    reason: "Document storage and organization"
  - name: Downloads
    reason: "Downloaded files and internet content"
  - name: Pictures
    reason: "Image and photo storage"
  - name: Developer
    reason: "Development projects and code storage"