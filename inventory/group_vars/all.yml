---
# Global variables for all hosts
# These variables are used across all playbooks and roles

# User configuration
user: "{{ lookup('env', 'USER') }}"
home: "{{ lookup('env', 'HOME') }}"

# Bootstrap phase packages - Essential for system preparation
bootstrap_packages:
  - name: base-devel
    reason: "Build tools for AUR packages (make, gcc, etc.)"
  - name: git
    reason: "Version control for cloning repositories"
  - name: wget
    reason: "File downloader (fallback tool)"
  - name: curl
    reason: "Primary file transfer tool"
  - name: python
    reason: "Ansible runtime dependency"
  - name: ansible
    reason: "Automation tool itself"

# Required Ansible collections for extended functionality
ansible_collections:
  - name: community.general
    version: ">=8.0.0"
    reason: "Provides yay module and system utilities for Arch Linux"
  - name: ansible.posix
    version: ">=1.5.0"
    reason: "Provides filesystem and POSIX system modules"
  - name: community.crypto
    version: ">=2.0.0"
    reason: "Provides cryptographic and SSL modules for security tasks"

# Base system packages - Essential system utilities
base_system_packages:
  - name: btop
    category: monitoring
    reason: "Advanced system monitor with resource usage"
  - name: fastfetch
    category: monitoring
    reason: "Fast system information display tool"
  - name: ranger
    category: filemanagement
    reason: "Terminal-based file manager with vim-like navigation"
  - name: nautilus
    category: filemanagement
    reason: "GUI file manager for desktop environment"
  - name: sushi
    category: filemanagement
    reason: "Quick file preview tool for nautilus"
  - name: ncdu
    category: disk
    reason: "NCurses disk usage analyzer for large directories"
  - name: tree
    category: disk
    reason: "Directory tree visualization tool"

# Base system directories - Essential user directories
base_directories:
  - name: Documents
    reason: "Document storage and organization"
  - name: Downloads
    reason: "Downloaded files and internet content"
  - name: Pictures
    reason: "Image and photo storage"
  - name: Developer
    reason: "Development projects and code storage"