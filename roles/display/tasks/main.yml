---
# Display & Desktop Foundation setup
# Installs SDDM, fonts, themes, and visual foundation

- name: Update package cache
  pacman:
    update_cache: yes
  tags: display, prep

# SDDM Display Manager Setup
- name: Install SDDM display manager
  pacman:
    name: sddm
    state: present
  tags: display, sddm, core

- name: Create SDDM configuration directory
  file:
    path: /etc/sddm.conf.d
    state: directory
    mode: '0755'
  tags: display, sddm, config

- name: Configure SDDM to use sugar-candy theme
  lineinfile:
    path: /etc/sddm.conf.d/theme.conf
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    create: yes
    backup: yes
  loop:
    - { key: 'Theme', value: 'sddm-sugar-candy' }
    - { key: 'CursorTheme', value: 'bibata-cursor-theme' }
  tags: display, sddm, config

# Font Installation
- name: Install base fonts
  pacman:
    name:
      - ttf-font-awesome
      - ttf-cascadia-mono-nerd
      - noto-fonts
      - noto-fonts-emoji
      - ttf-jetbrains-mono-nerd
      - noto-fonts-cjk
      - noto-fonts-extra
      - woff2-font-awesome
    state: present
  tags: display, fonts, base

# SDDM Sugar Candy Theme (AUR)
- name: Install SDDM Sugar Candy theme from AUR
  command: yay -S --noconfirm --needed sddm-sugar-candy
  become: true
  become_user: "{{ user }}"
  register: sugar_candy_install
  failed_when: false
  tags: display, sddm, theme, aur

# GTK Themes, Icons, and Cursors
- name: Install Catppuccin GTK theme from AUR
  command: yay -S --noconfirm --needed catppuccin-gtk-theme-mocha
  become: true
  become_user: "{{ user }}"
  register: catppuccin_install
  failed_when: false
  tags: display, themes, gtk, aur

- name: Install icon theme from repos
  become: true
  pacman:
    name:
      - papirus-icon-theme
    state: present
  tags: display, themes, gtk

- name: Install Bibata cursor theme from AUR
  command: yay -S --noconfirm --needed bibata-cursor-theme
  become: true
  become_user: "{{ user }}"
  register: bibata_install
  failed_when: false
  tags: display, themes, gtk, aur

# Theme Environment Configuration
- name: Create theme environment configuration
  lineinfile:
    path: /etc/environment
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    create: yes
    backup: yes
  loop:
    - { key: 'GTK_THEME', value: 'Catppuccin-Mocha-Standard-Rosewater-Dark' }
    - { key: 'QT_QPA_PLATFORMTHEME', value: 'gtk2' }
  tags: display, themes, environment

# User-level theme configuration
- name: Ensure user config directories exist
  file:
    path: "/home/{{ user }}/{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0755'
  loop:
    - .config
    - .local/share/icons
    - .local/share/themes
  tags: display, themes, user

- name: Configure GTK settings for user
  blockinfile:
    path: "/home/{{ user }}/.config/gtk-3.0/settings.ini"
    create: yes
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0644'
    block: |
      [Settings]
      gtk-theme-name=Catppuccin-Mocha-Standard-Rosewater-Dark
      gtk-icon-theme-name=Papirus
      gtk-cursor-theme-name=Bibata-Modern-Classic
      gtk-font-name=Cascadia Code Nerd Font 11
  tags: display, themes, gtk, user

- name: Copy GTK settings to GTK-4
  copy:
    src: "/home/{{ user }}/.config/gtk-3.0/settings.ini"
    dest: "/home/{{ user }}/.config/gtk-4.0/settings.ini"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0644'
    remote_src: yes
  tags: display, themes, gtk, user

# Service Configuration
- name: Enable and start SDDM service
  systemd:
    name: sddm
    state: started
    enabled: yes
    daemon_reload: yes
  tags: display, sddm, service

# Verification
- name: Verify SDDM is running
  command: systemctl is-active sddm
  register: sddm_check
  failed_when: false
  changed_when: false
  tags: display, verification

- name: Verify font installation
  command: fc-list | grep -i "{{ item }}" | head -1
  register: font_check
  failed_when: false
  changed_when: false
  loop:
    - "Cascadia"
    - "JetBrains"
    - "Font Awesome"
  tags: display, verification, fonts

- name: Verify theme packages are installed
  command: "{{ item }} --version 2>/dev/null || echo 'version check failed'"
  register: theme_check
  failed_when: false
  changed_when: false
  loop:
    - "sddm"
  tags: display, verification, themes

- name: Display installation summary
  debug:
    msg: |
      Display & Desktop Foundation Complete:
      - SDDM: {{ 'active' if sddm_check.stdout == 'active' else 'inactive' }}
      - Fonts: {{ 'installed' if font_check.results | selectattr('stdout', 'ne', '') | list | length > 0 else 'missing' }}
      - Themes: Catppuccin-Mocha, Papirus, Bibata configured
      - SDDM Theme: sugar-candy
  tags: display, summary