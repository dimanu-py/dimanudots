- name: Install AUR theme packages
  loop: "{{ aur_theme_packages | selectattr('aur', 'equalto', 'true') | map(attribute='name') | list }}"
  command: yay -S --noconfirm --needed {{ item.name }}
  become: true
  become_user: "{{ user }}"
  register: aur_theme_install
  failed_when: false
  loop_control:
    label: "{{ item.name }}"
  tags: display, themes, gtk, aur

- name: Install theme packages from repos
  pacman:
    name: "{{ theme_packages | selectattr('aur', 'equalto', 'false') | map(attribute='name') | list }}"
    state: present
  tags: display, themes, gtk

- name: Create theme environment configuration
  lineinfile:
    path: /etc/environment
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    create: yes
    backup: yes
  loop:
    - { key: 'GTK_THEME', value: '{{ gtk_theme }}' }
    - { key: 'QT_QPA_PLATFORMTHEME', value: 'gtk2' }
  tags: display, themes, environment

- name: Ensure user config directories exist
  file:
    path: "/home/{{ user }}/{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0755'
  loop: "{{ user_config_dirs }}"
  tags: display, themes, user

- name: Configure GTK settings for user
  blockinfile:
    path: "/home/{{ user }}/.config/gtk-3.0/settings.ini"
    create: yes
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0644'
    block: |
      [Settings]
        gtk-theme-name={{ gtk_theme }}
        gtk-icon-theme-name={{ gtk_icon_theme }}
        gtk-cursor-theme-name={{ gtk_cursor_theme }}
        gtk-font-name={{ gtk_font }}
  tags: display, themes, gtk, user

- name: Copy GTK settings to GTK-4
  copy:
    src: "/home/{{ user }}/.config/gtk-3.0/settings.ini"
    dest: "/home/{{ user }}/.config/gtk-4.0/settings.ini"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0644'
    remote_src: yes
  tags: display, themes, gtk, user