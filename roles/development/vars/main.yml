---
# Development role variables
# Terminal, editors, tools, and enhanced utilities with AUR categorization

terminal:
  - name: ghostty
    category: emulator
    aur: true
    reason: "Modern terminal emulator with GPU acceleration"
  - name: zsh
    category: shell
    aur: false
    reason: "Powerful shell with advanced features"
  - name: starship
    category: prompt
    aur: true
    reason: "Customizable shell prompt with rich formatting"
  - name: tmux
    category: multiplexer
    aur: false
    reason: "Terminal multiplexer for multiple sessions"

editors:
  - name: neovim
    category: editor
    aur: false
    reason: "Modern modal text editor with LSP support"
  - name: nano
    category: editor
    aur: false
    reason: "Simple terminal-based text editor"
  - name: visual-studio-code-bin
    category: editor
    aur: true
    reason: "Popular IDE with extensive plugin ecosystem"
  - name: jetbrains-toolbox
    category: editor
    aur: true
    reason: "JetBrains IDE suite management tool"

git_tools:
  - name: lazygit
    category: vcs
    aur: true
    reason: "Terminal Git UI with lazy evaluation"
  - name: diff-so-fancy
    category: vcs
    aur: true
    reason: "Enhanced diff display with colors and symbols"
  - name: git-delta
    category: vcs
    aur: false
    reason: "Better git diff viewer with syntax highlighting"

container_tools:
  - name: docker
    category: containers
    aur: false
    reason: "Container platform for application deployment"
  - name: docker-compose
    category: containers
    aur: false
    reason: "Multi-container orchestration tool"
  - name: docker-buildx
    category: containers
    aur: false
    reason: "Extended Docker build capabilities"
  - name: lazydocker
    category: containers
    aur: true
    reason: "Terminal UI for Docker management"

dev_tools:
  - name: dbeaver
    category: database
    aur: true
    reason: "Universal database GUI client"
  - name: bruno-bin
    category: api
    aur: true
    reason: "Modern API testing and documentation tool"
  - name: mise
    category: env
    aur: true
    reason: "Development environment manager for multiple runtimes"
  - name: github-cli
    category: vcs
    aur: false
    reason: "CLI application to manage GitHub"

terminal_utilities:
  - name: fzf
    category: search
    aur: false
    reason: "Command-line fuzzy finder"
  - name: fd
    category: search
    aur: false
    reason: "Fast find alternative with better defaults"
