---
# Shell configuration and integration
# Zsh setup, starship prompt, and development environment

- name: Create Zsh configuration directories
  file:
    path: "/home/{{ user }}/{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0755'
  loop:
    - ".config/zsh"
    - ".local/share/zsh"
  tags: development, shell, config