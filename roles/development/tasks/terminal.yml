---
# Terminal setup
# Install terminal emulator, shell, and prompt

- name: Update package cache
  pacman:
    update_cache: yes
  tags: development, terminal, prep

- name: Install terminal emulator and shell
  pacman:
    name: "{{ terminal | selectattr('aur', 'equalto', false) | map(attribute='name') | list }}"
    state: present
  tags: development, terminal, core

- name: Install terminal packages from AUR
  loop: "{{ terminal | selectattr('aur', 'equalto', true) | map(attribute='name') | list }}"
  command: yay -S --noconfirm --needed {{ item }}
  become: true
  become_user: "{{ user }}"
  register: terminal_aur_install
  failed_when: false
  loop_control:
    label: "{{ item }}"
  tags: development, terminal, aur

- name: Install terminal tools
  pacman:
    name: "{{ terminal_utilities | selectattr('aur', 'equalto', false) | map(attribute='name') | list }}"
    state: present
  tags: development, search, core

- name: Install terminal tools from AUR
  loop: "{{ terminal_utilities | selectattr('aur', 'equalto', true) | map(attribute='name') | list }}"
  command: yay -S --noconfirm --needed {{ item }}
  become: true
  become_user: "{{ user }}"
  register: search_aur_install
  failed_when: false
  loop_control:
    label: "{{ item }}"
  tags: development, search, aur