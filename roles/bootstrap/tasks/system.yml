---
# System preparation for bootstrap phase
# Essential packages needed for Ansible automation and AUR package management

- name: Update pacman cache
  pacman:
    update_cache: yes
    state: present
  tags: bootstrap, system

- name: Install system preparation packages
  pacman:
    name: "{{ bootstrap_packages | map(attribute='name') | list }}"
    state: present
  tags: bootstrap, system
