---
# Network configuration with NetworkManager and WiFi management tools
# Ensures network connectivity and provides management interfaces

- name: Update package cache
  pacman:
    update_cache: yes
  tags: hardware, network, prep

- name: Install network packages
  pacman:
    name: "{{ network_packages | map(attribute='name') | list }}"
    state: present
  tags: hardware, network

- name: Ensure NetworkManager service is enabled
  systemd:
    name: NetworkManager
    state: started
    enabled: yes
    daemon_reload: yes
  tags: hardware, network, service

- name: Verify NetworkManager is running
  command: systemctl is-active NetworkManager
  register: nm_check
  tags: hardware, network, verification

- name: Verify WiFi interface detection
  command: nmcli device status
  register: wifi_check
  tags: hardware, network, verification