---
# Desktop components installation
# Status bar, notifications, wallpaper, clipboard management

- name: Install desktop components from repos
  pacman:
    name: "{{ desktop_components | selectattr('aur', 'equalto', false) | map(attribute='name') | list }}"
    state: present
  tags: hyprland, desktop, components

- name: Install app launcher from AUR
  loop: "{{ app_launcher | map(attribute='name') | list }}"
  command: yay -S --noconfirm --needed {{ item }}
  become: true
  become_user: "{{ user }}"
  register: launcher_install
  failed_when: false
  loop_control:
    label: "{{ item }}"
  tags: hyprland, desktop, launcher, aur

- name: Verify desktop components
  command: "{{ item }} --version"
  register: desktop_check
  failed_when: false
  changed_when: false
  loop: "{{ desktop_components | map(attribute='name') | list }}"
  loop_control:
    label: "{{ item }}"
  tags: hyprland, desktop, verification