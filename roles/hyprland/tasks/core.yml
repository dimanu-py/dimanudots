---
# Core Hyprland installation
# Installs main compositor and essential utilities

- name: Update package cache
  pacman:
    update_cache: yes
  tags: hyprland, core, prep

- name: Install core Hyprland packages from repos
  pacman:
    name: "{{ hyprland_packages | selectattr('aur', 'equalto', false) | map(attribute='name') | list }}"
    state: present
  tags: hyprland, core, packages

- name: Install core Hyprland packages from AUR
  loop: "{{ hyprland_packages | selectattr('aur', 'equalto', true) | map(attribute='name') | list }}"
  command: yay -S --noconfirm --needed {{ item }}
  become: true
  become_user: "{{ user }}"
  register: hyprland_aur_install
  failed_when: false
  loop_control:
    label: "{{ item }}"
  tags: hyprland, core, aur
