---
# Session management and services
# UWSM session manager, clipboard persistence, systemd services

- name: Enable UWSM user service
  systemd:
    name: uwsm
    state: started
    enabled: yes
    daemon_reload: yes
    scope: user
  when: session_services | selectattr('name', 'equalto', 'uwsm') | selectattr('enabled', 'equalto', true) | list | length > 0
  tags: hyprland, session, uwsm, service

- name: Enable wl-clip-persist user service
  systemd:
    name: wl-clip-persist
    state: started
    enabled: yes
    daemon_reload: yes
    scope: user
  when: session_services | selectattr('name', 'equalto', 'wl-clip-persist') | selectattr('enabled', 'equalto', true) | list | length > 0
  tags: hyprland, session, clipboard, service

- name: Verify session services are running
  command: systemctl --user is-active {{ item.name }}
  register: session_check
  failed_when: false
  changed_when: false
  loop: "{{ session_services | selectattr('enabled', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.name }}"
  tags: hyprland, session, verification