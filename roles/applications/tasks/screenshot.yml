---
# Screenshot and graphics utilities
# Image manipulation, screenshot tools, and annotation applications

- name: Install screenshot packages from repos
  pacman:
    name: "{{ screenshot_packages | selectattr('aur', 'equalto', false) | map(attribute='name') | list }}"
    state: present
  tags: applications, screenshot, core

- name: Install screenshot packages from AUR
  loop: "{{ screenshot_packages | selectattr('aur', 'equalto', true) | map(attribute='name') | list }}"
  command: yay -S --noconfirm --needed {{ item }}
  become: true
  become_user: "{{ user }}"
  register: screenshot_aur_install
  failed_when: false
  loop_control:
    label: "{{ item }}"
  tags: applications, screenshot, aur
