---
# Office suite and productivity applications
# Document viewers, office suite, and printing support

- name: Install office packages from repos
  pacman:
    name: "{{ office_packages | selectattr('aur', 'equalto', false) | map(attribute='name') | list }}"
    state: present
  tags: applications, office, core

- name: Install office packages from AUR
  loop: "{{ office_packages | selectattr('aur', 'equalto', true) | map(attribute='name') | list }}"
  command: yay -S --noconfirm --needed {{ item }}
  become: true
  become_user: "{{ user }}"
  register: office_aur_install
  failed_when: false
  loop_control:
    label: "{{ item }}"
  tags: applications, office, aur
