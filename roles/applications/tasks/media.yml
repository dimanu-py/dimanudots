---
# Media and entertainment applications
# Audio/video players, recording tools, and graphics utilities

- name: Install media packages from repos
  pacman:
    name: "{{ media_packages | selectattr('aur', 'equalto', false) | map(attribute='name') | list }}"
    state: present
  tags: applications, media, core

- name: Install media packages from AUR
  loop: "{{ media_packages | selectattr('aur', 'equalto', true) | map(attribute='name') | list }}"
  command: yay -S --noconfirm --needed {{ item }}
  become: true
  become_user: "{{ user }}"
  register: media_aur_install
  failed_when: false
  loop_control:
    label: "{{ item }}"
  tags: applications, media, aur
