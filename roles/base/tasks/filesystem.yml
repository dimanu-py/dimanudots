---
# Base system filesystem setup
# Creates essential user directories and sets proper permissions

- name: Create essential user directories
  file:
    path: "{{ home }}/{{ item.name }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0755'
  loop: "{{ base_directories }}"
  loop_control:
    label: "{{ item.name }}"
  tags: base, filesystem
