---
# Yay AUR helper installation with idempotent design
# Installs yay only if not already present

- name: Check if yay is already installed
  command: which yay
  register: yay_check
  failed_when: false
  changed_when: false
  tags: bootstrap, yay

- name: Create temporary build directory for yay
  file:
    path: /tmp/yay-git
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0755'
  when: yay_check.rc != 0
  tags: bootstrap, yay

- name: Clone yay AUR repository
  git:
    repo: https://aur.archlinux.org/yay-git.git
    dest: /tmp/yay-git
    clone: yes
    update: no
  when: yay_check.rc != 0
  tags: bootstrap, yay

- name: Change yay directory ownership to user
  file:
    path: /tmp/yay-git
    owner: "{{ user }}"
    group: "{{ user }}"
    recurse: yes
  when: yay_check.rc != 0
  tags: bootstrap, yay

- name: Build and install yay as user with sudo access
  command: makepkg -si --noconfirm
  args:
    chdir: /tmp/yay-git
  become_user: "{{ user }}"
  become: true
  when: yay_check.rc != 0
  tags: bootstrap, yay

- name: Clean up yay build directory
  file:
    path: /tmp/yay-git
    state: absent
  when: yay_check.rc != 0
  tags: bootstrap, yay

- name: Verify yay installation
  command: yay --version
  register: yay_verify
  changed_when: false
  tags: bootstrap, yay

- name: Display yay version
  debug:
    msg: "Yay installed successfully: {{ yay_verify.stdout }}"
  when: yay_check.rc != 0
  tags: bootstrap, yay

- name: Confirm yay is available
  assert:
    that:
      - yay_verify.rc == 0
    success_msg: "Yay is installed and functional"
    fail_msg: "Yay installation failed or yay is not in PATH"
  tags: bootstrap, yay