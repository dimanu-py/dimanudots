---
# Network configuration with NetworkManager and WiFi management tools
# Ensures network connectivity and provides management interfaces

- name: Update package cache
  pacman:
    update_cache: yes
  tags: hardware, network, prep

- name: Install NetworkManager core
  pacman:
    name: "{{ hardware_packages | selectattr('category', 'equalto', 'network') | selectattr('name', 'equalto', 'networkmanager') | map(attribute='name') | list }}"
    state: present
  tags: hardware, network, core

- name: Install network management tools
  pacman:
    name: "{{ hardware_packages | selectattr('category', 'equalto', 'network') | selectattr('name', 'in', ['network-manager-applet', 'nm-connection-editor', 'whois', 'impala']) | map(attribute='name') | list }}"
    state: present
  tags: hardware, network, tools

- name: Ensure NetworkManager service is enabled
  systemd:
    name: NetworkManager
    state: started
    enabled: yes
    daemon_reload: yes
  tags: hardware, network, service

- name: Verify NetworkManager is running
  command: systemctl is-active NetworkManager
  register: nm_check
  tags: hardware, network, verification

- name: Verify WiFi interface detection
  command: nmcli device status
  register: wifi_check
  tags: hardware, network, verification

- name: Display network installation summary
  debug:
    msg: "NetworkManager installed and active (WiFi: {{ 'available' if 'wifi' in wifi_check.stdout else 'not detected' }})"
  tags: hardware, network, info

- name: Assert network configuration is working
  assert:
    that:
      - nm_check.rc == 0
      - "'active' in nm_check.stdout"
    success_msg: "NetworkManager is installed and running successfully"
    fail_msg: "NetworkManager failed to start or is not active"
  tags: hardware, network, verification